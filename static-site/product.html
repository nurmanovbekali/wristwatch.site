<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c0d" />
<title>WristWatch.uz</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .product-detail-grid { display: grid; grid-template-columns: 1fr; gap: 40px; padding: 150px 20px 40px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 860px) { .product-detail-grid { grid-template-columns: 1fr 1fr; padding: 170px 32px 40px; align-items: start; } }
  .pd-image { position: relative; aspect-ratio: 1/1; border-radius: 1.25rem; overflow: hidden; background: var(--graphite); }
  .pd-image img { width: 100%; height: 100%; object-fit: cover; }
  .pd-category { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.75rem; color: var(--steel); margin-bottom: 10px; }
  .pd-name { font-size: clamp(1.7rem, 4vw, 2.4rem); margin-bottom: 12px; }
  .pd-price { font-size: 1.4rem; color: var(--steel-light); margin-bottom: 28px; }
  .pd-desc-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--steel); margin-bottom: 8px; }
  .pd-desc { color: rgba(242,242,240,0.7); line-height: 1.8; margin-bottom: 32px; }
</style>
</head>
<body>

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="logo">WRISTWATCH<span class="dim">.UZ</span></a>
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="catalog.html" data-i18n="nav.catalog"></a>
      <a href="about.html" data-i18n="nav.about"></a>
      <a href="contact.html" data-i18n="nav.contact"></a>
      <div class="lang-switcher">
        <button class="lang-btn"><span id="lang-current">UZ</span> ▾</button>
        <div class="lang-dropdown">
          <button data-lang="uz">O'zbekcha</button>
          <button data-lang="ru">Русский</button>
          <button data-lang="en">English</button>
        </div>
      </div>
    </nav>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-menu">
    <a href="index.html" data-i18n="nav.home"></a>
    <a href="catalog.html" data-i18n="nav.catalog"></a>
    <a href="about.html" data-i18n="nav.about"></a>
    <a href="contact.html" data-i18n="nav.contact"></a>
    <div class="lang-switcher">
      <button class="lang-btn"><span id="lang-current-m">UZ</span> ▾</button>
      <div class="lang-dropdown">
        <button data-lang="uz">O'zbekcha</button>
        <button data-lang="ru">Русский</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<p class="state-msg" id="product-loading" data-i18n="catalog.loading" style="padding-top:170px"></p>

<div class="notfound" id="product-notfound" style="display:none">
  <p data-i18n="product.not_found"></p>
  <a href="catalog.html" class="btn btn-primary" data-i18n="product.back"></a>
</div>

<div id="product-content" style="display:none">
  <div class="product-detail-grid">
    <div class="pd-image reveal">
      <img id="product-image" src="" alt="" onerror="handleImgError(this)">
      <div class="product-thumb-fallback" data-i18n="product.image_unavailable"></div>
    </div>
    <div class="reveal">
      <p class="pd-category" id="product-category"></p>
      <h1 class="pd-name" id="product-name"></h1>
      <p class="pd-price" id="product-price"></p>

      <p class="pd-desc-title" data-i18n="product.description"></p>
      <p class="pd-desc" id="product-description"></p>

      <form class="form-stack" id="order-form" style="max-width:380px">
        <input class="field" id="order-name" type="text" required data-i18n-placeholder="product.name_placeholder" placeholder="">
        <input class="field" id="order-phone" type="tel" required data-i18n-placeholder="product.phone_placeholder" placeholder="">
        <button type="submit" class="btn btn-primary" id="order-submit" data-i18n="product.order_via_telegram"></button>
        <p class="form-note" data-i18n="product.order_note"></p>
        <p id="order-status"></p>
      </form>
    </div>
  </div>

  <section class="container pb-page" id="product-specs-section" style="display:none;padding-top:20px;border-top:1px solid var(--line);max-width:1100px;margin-top:20px">
    <p class="uppercase-label" data-i18n="product.spec_eyebrow" style="margin-top:40px;margin-bottom:8px"></p>
    <h2 style="font-size:clamp(1.4rem,3vw,1.8rem);margin-bottom:32px" data-i18n="product.spec_title"></h2>
    <div class="spec-grid" id="product-specs"></div>
  </section>

  <section class="container pb-page" id="related-section" style="max-width:1100px">
    <h2 style="font-size:clamp(1.4rem,3vw,1.8rem);margin-bottom:32px" data-i18n="product.related"></h2>
    <div class="product-grid" id="related-grid"></div>
  </section>
</div>

<footer class="footer">
  <div class="container footer-grid">
    <div>
      <div class="logo">WRISTWATCH<span class="dim">.UZ</span></div>
      <p class="footer-tagline" data-i18n="footer.tagline"></p>
    </div>
    <div class="footer-links">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="catalog.html" data-i18n="nav.catalog"></a>
      <a href="about.html" data-i18n="nav.about"></a>
      <a href="contact.html" data-i18n="nav.contact"></a>
    </div>
    <div class="footer-links">
      <a href="tel:+998332311101">+998 33 231 11 01</a>
      <a href="https://t.me/wristwatchuzbb" target="_blank" rel="noreferrer">Telegram</a>
      <a href="https://www.instagram.com/wristwatch__uz/" target="_blank" rel="noreferrer">Instagram</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span id="footer-year"></span> WRISTWATCH.UZ — <span data-i18n="footer.rights"></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/products.js"></script>
<script>
  document.getElementById('footer-year').textContent = new Date().getFullYear();
  document.addEventListener('DOMContentLoaded', function () {
    initProductPage();
    initOrderForm();
  });
</script>
</body>
</html>
