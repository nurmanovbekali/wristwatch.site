<script>
  // Applied before first paint to avoid a wrong-theme flash.
  (function () {
    try {
      var saved = localStorage.getItem('ww_theme');
      var theme = (saved === 'light' || saved === 'dark') ? saved :
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>

<script>
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  function renderMarquee() {
    var track = document.getElementById('marquee-track');
    var text = t('marquee.text');
    var html = '';
    for (var r = 0; r < 2; r++) {
      html += '<div style="display:flex;flex-shrink:0;">';
      for (var i = 0; i < 6; i++) html += '<span>' + text + '</span>';
      html += '</div>';
    }
    track.innerHTML = html;
  }
  document.addEventListener('DOMContentLoaded', function () {
    renderMarquee();
    loadFeaturedProducts();
  });
  document.addEventListener('ww:langchange', renderMarquee);
</script>
